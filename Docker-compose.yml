services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: always
    ports:
      - "${N8N_PORT}:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - app-network

  ytdlp-api:
    build: ./ytdlp-api
    container_name: ytdlp-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./ytdlp-api/downloads:/app/downloads
    networks:
      - app-network

networks:
  app-network: